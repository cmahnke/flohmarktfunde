baseURL = "https://flohmarktfunde.projektemacher.org/"
locale = "de"
title = "Flohmarktfunde"
publishDir = "docs"
canonifyURLs = true
defaultContentLanguage = "de"
disablePathToLower = true
theme = ["observer-hugo", "projektemacher-base"]
enableGitInfo = true

[params]
    copyrightYears = "2014 - 2020"
    logo = "/images/logo.png"
    linkTumblr = true
    keywords = "Flohmarkt, Trödel, Antiquariat, Flea market, Göttingen, Bremen"
    description = "Fundstücke vom Flohmarkt und aus Trödelläden"
    schemaPerson = "https://christianmahnke.de/person.jsonld"

[params.author]
    email = 'mail@christianmahnke.de'
    name = 'Christian Mahnke'
    uri = 'http://www.wikidata.org/entity/Q137668638'

[languages]
    [languages.de]
        label = "Deutsch"

        [languages.de.menu]

            [[languages.de.menu.main]]
                name = "Home"
                weight = 1
                url = "/"

            [[languages.de.menu.main]]
                name = "Über dieses Blog"
                weight = 2
                url = "about/"

            [[languages.de.menu.main]]
                name = "Flohmärkte und Trödelläden"
                weight = 3
                url = "sources/"

            [[languages.de.menu.main]]
                name = "Informationsquellen"
                weight = 4
                url = "links/"

    [languages.en]
        label = "English"

        [languages.en.params]
            keywords = "Flea market, Junk shop, Antiquarian bookshop, Flea market, Göttingen, Bremen"
            description = "Finds from flea markets and antique shops"

        [languages.en.menu]

            [[languages.en.menu.main]]
                name = "Home"
                weight = 1
                url = "/"

            [[languages.en.menu.main]]
                name = "About this blog"
                weight = 2
                url = "about/"

            [[languages.en.menu.main]]
                name = "Flea markets and antique shops"
                weight = 3
                url = "sources/"

            [[languages.en.menu.main]]
                name = "Information sources"
                weight = 4
                url = "links/"

[markup]
    defaultMarkdownHandler = 'goldmark'

[markup.goldmark]
    [markup.goldmark.renderer]
        unsafe= true

    [markup.goldmark.extensions]
        attribute = true
        strikethrough = true

    [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '&ldquo;'
        leftSingleQuote = '&lsquo;'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '&rdquo;'
        rightSingleQuote = '&rsquo;'

    [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.insert]
            enable = true
        [markup.goldmark.extensions.extras.mark]
            enable = true
        [markup.goldmark.extensions.extras.subscript]
            enable = true
        [markup.goldmark.extensions.extras.superscript]
            enable = true

    [markup.goldmark.parser]
        autoHeadingID = true
        autoHeadingIDType = "github"

[module]
    [[module.mounts]]
        source = "assets/scss"
        target = "assets/scss"

    [[module.mounts]]
        source = "static"
        target = "static"

[build]
  writeStats = true

[security]
  [security.http]
    mediaTypes = ['^application/json$', '^application/json;\s?charset=[uU][tT][fF]-8$', '^application/sparql-results\+json;\s?charset=[uU][tT][fF]-8$']
