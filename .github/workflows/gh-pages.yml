name: Publish on GitHub pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.168.0
  DEPENDENCY_MANAGER: npm

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Install required dependencies
        run: |
          ./scripts/github-setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - name: Generate Files
        run: |
          ./scripts/setup.sh

      - name: Install Node dependencies
        run: |
          $DEPENDENCY_MANAGER install
          $DEPENDENCY_MANAGER run logo

      - name: Setup Dart Sass
        run: |
          mkdir -p "$HOME/.local/opt"
          curl -sL https://github.com/sass/dart-sass/releases/download/1.105.2/dart-sass-1.105.2-linux-x64.tar.gz | tar -xz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/dart-sass" >> "$GITHUB_PATH"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build Hugo site
        run: hugo --printI18nWarnings --printUnusedTemplates

      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
